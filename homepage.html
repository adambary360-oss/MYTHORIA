<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/script.js" defer></script>

</head>

<body
    class="bg-[url('assets/backgrands/backgrand.png')] bg-no-repeat bg-cover bg-center bg-fixed items-center my-[10px]">
    <header class="backdrop-blur-lg  rounded-3xl border border-white/20 shadow-2xl shadow-black/10">
        <ul class="flex justify-around ">
            <li><a href="/homepage.html"
                    class="bg-no-repeat bg-center bg-contain w-[300px] h-[100px] flex items-center justify-center 
text-gray-50 text-3xl transition-transform hover:scale-105 font-[family-name:'MedievalSharp', cursive] text-shadow-lg/40">Accueil</a>
            </li>
            <li><a href="/Boutique.html "
                    class="  bg-no-repeat bg-center bg-contain w-[300px] h-[100px] flex items-center justify-center 
text-gray-50 text-3xl transition-transform hover:scale-105 font-[family-name:'MedievalSharp', cursive] text-shadow-lg/30">Boutique</a>
            </li>
            <img src="/assets/logo/logo.png" alt="logo" class="size-fit max-h-[100px] m-50px]">
            <li><a href="/Grimoire.html"
                    class="  bg-no-repeat bg-center bg-contain w-[300px] h-[100px] flex items-center justify-center 
text-gray-50 text-3xl transition-transform hover:scale-105 font-[family-name:'MedievalSharp', cursive] text-shadow-lg/30">Grimoire</a>
            </li>
            <li><a href="/Deck.html"
                    class=" bg-no-repeat bg-center bg-contain w-[300px] h-[100px] flex items-center justify-center 
text-gray-50 text-3xl transition-transform hover:scale-105 font-[family-name:'MedievalSharp', cursive] text-shadow-lg/30">Deck</a>
            </li>
        </ul>
    </header>
    <main>
        <section class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center mb-20">
            <div
                class="backdrop-blur-lg h-[700px] border border-white/20 shadow-2xl shadow-black/10 flex flex-col items-center justify-center rounded-3xl mt-[50px] ml-[50px] p-[25px]">
                <img src="/assets/logo/logo.png" alt="logo" class="size-fit max-h-[100px] m-[50px]">
                <p class="text-black-400 mb-8 leading-relaxed">
                    Plongez dans un univers sombre où chaque carte est un fragment d'histoire interdite. Collectionnez,
                    bâtissez votre destin, et préparez-vous au combat.
                </p>
                <div class="flex gap-4">
                    <button
                        class="bg-amber-900 border-2 border-amber-600 px-8 py-3 uppercase font-bold hover:bg-amber-800 transition">Boutique</button>
                    <button
                        class="bg-amber-900 border-2 border-stone-600 px-8 py-3 uppercase font-bold hover:bg-stone-800 transition">Grimoire</button>
                </div>
            </div>
            <div class="h-[700px] flex items-center justify-center">
                <img src="assets/hero/hero.png" alt="hero" class="h-[700px]">
            </div>
        </section>

    </main>
</body>

</html>
