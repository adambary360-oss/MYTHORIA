<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythoria — Area</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="js/common.js" defer></script>
    <script src="cards-data.js" defer></script>
    <script src="all cards.js" defer></script>
    <script src="js/deck.js" defer></script>
    <script src="js/area.js/combat.js" defer></script>
    <script src="js/area.js/main.js" defer></script>
    <script src="js/area.js/opponent.js" defer></script>
    <script src="js/area.js/state.js" defer></script>
    <script src="js/area.js/turns.js" defer></script>
    <script src="js/area.js/ui.js" defer></script>
    <script src="js/area.js/coinflip.js" defer></script>
    <script src="js/area.js/utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[url('assets/backgrands/backgrand.png')] bg-no-repeat bg-cover bg-center bg-fixed min-h-screen">

    <header
        class="relative z-50 backdrop-blur-lg rounded-3xl border border-white/20 shadow-2xl shadow-black/10 my-3 mx-auto max-w-7xl px-4 py-2">
        <nav class="flex flex-wrap items-center justify-between gap-4">
            <!-- Logo -->
            <a href="homepage.html" class="flex items-center shrink-0">
                <img src="assets/logo/logo.png" alt="logo Mythoria"
                    class="h-16 md:h-20 w-auto object-contain hover:scale-105 transition">
            </a>

            <!-- Navigation Links -->
            <ul
                class="flex flex-wrap items-center justify-center gap-2 sm:gap-4  md:gap-6 font-[family-name:'MedievalSharp',cursive] text-lg sm:text-xl md:text-2xl text-gray-100">
                <li>
                    <a href="Boutique.html"
                        class="px-3 py-1 rounded-xl hover:text-amber-400 hover:bg-white/10 transition-all">Boutique</a>
                </li>
                <li>
                    <a href="Grimoire.html"
                        class="px-3 py-1 rounded-xl hover:text-amber-400 hover:bg-white/10 transition-all">Grimoire</a>
                </li>
                <li>
                    <a href="Deck.html"
                        class="px-3 py-1 rounded-xl hover:text-amber-400 hover:bg-white/10 transition-all">Deck</a>
                </li>
                <li>
                    <a href="inboxing.html"
                        class="px-3 py-1 rounded-xl hover:text-amber-400 hover:bg-white/10 transition-all">Inboxing</a>
                </li>
                <li>
                    <a href="area.html"
                        class="px-3 py-1 rounded-xl text-amber-400 font-bold underline bg-white/10 transition-all">Area</a>
                </li>
            </ul>

            <!-- Panier -->
            <div class="relative z-50">
                <details
                    class="relative p-2 w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-[#292929]/90 border border-white/10 open:fixed sm:open:absolute open:top-4 sm:open:top-auto open:right-4 sm:open:right-0 open:w-[90vw] sm:open:w-[360px] open:h-auto open:max-h-[80vh] open:overflow-y-auto open:shadow-2xl open:z-50 backdrop-blur-md">
                    <summary class="list-none relative cursor-pointer flex justify-center items-center w-full h-full">
                        <img src="assets/Panier/Panier.png" alt="Panier" class="max-h-10 md:max-h-12 object-contain">
                        <span id="panier-badge"
                            class="absolute -top-2 -right-2 hidden h-6 min-w-6 px-1 rounded-full bg-amber-600 border border-amber-300 text-white text-xs font-bold text-center leading-6">0</span>
                    </summary>
                    <div class="pt-3">
                        <p class="text-gray-50 text-xl font-semibold">Panier: <span id="valeur-painer">0</span></p>
                        <p class="text-gray-50 text-xl font-semibold">Total: <span id="valeur-totale">0 DH</span></p>
                        <ul class="Panieritems my-3 space-y-2 max-h-48 overflow-y-auto"></ul>
                        <div class="flex gap-2 pt-2 border-t border-white/10">
                            <button
                                class="bg-amber-900 border border-amber-600 px-4 py-2 uppercase text-xs font-bold rounded hover:bg-amber-800 transition clear cursor-pointer">Clear</button>
                            <button
                                class="bg-amber-600 border border-amber-400 px-4 py-2 uppercase text-xs font-bold rounded hover:bg-amber-500 transition valider cursor-pointer flex-1 text-center">Valider</button>
                        </div>
                    </div>
                </details>
            </div>
        </nav>
    </header>
    <main class="flex justify-center ">

        <!-- coin o dlam o lil -->
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm" id="overlay">
            <div class="bg-slate-900 border border-white/20 p-8 rounded-3xl shadow-2xl flex flex-col md:flex-row gap-8"
                id="overlaydiv">
                <button class="bg-amber-900 border-2 border-amber-600 text-white px-8 py-3 rounded-xl uppercase tracking-wider font-bold hover:bg-amber-700 transition" id="btnflip">
                     flip the coin</button>

            </div>
        </div>




        <div class="grid grid-cols-12 gap-4 min-h-screen p-4 w-full">
            <div class="col-span-10 grid grid-row-5 gap-2">

                <!-- 1 -->
                <div class="grid grid-cols-5 row-span-1 border-2 gap-2  border-gray-300 rounded">

                </div>
                <!-- 2 -->
                <div class="grid row-span-3 grid-rows-7 gap-2 bg-gray-100 p-2 rounded">
                    <div class=" border-2 row-span-3">
                        <div></div>
                    </div>
                    <div class=" border-2 row-span-1"></div>
                    <div class=" border-2 row-span-3"></div>
                </div>
                <!-- 3 -->
                <div class="grid grid-cols-5 gap-2 border-2 border-gray-300 rounded " id="rendomcarts">


                </div>

            </div>
            <div class="col-span-2 bg-gray-400 p-4 rounded-xl flex flex-col justify-between">
                <div class="h-[300px] bg-gray-700"></div>
                <div class="h-[300px] bg-gray-700" id="jrcart"></div>
            </div>

        </div>
    </main>

</body>

</html>
